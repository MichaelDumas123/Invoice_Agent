[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-assistant-api"
version = "0.1.0"
description = "Human-reviewed accounts-payable invoice intake API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "asyncpg>=0.30,<1",
  "openpyxl>=3.1.5,<4",
  "langchain>=1.0,<2",
  "langchain-openrouter>=0.1,<1",
  "pymupdf>=1.24,<2",
  "pillow>=11,<13",
  "pillow-heif>=0.18,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-openpyxl>=3.1,<4", "pytest-asyncio>=1.2,<2"]

[tool.pillow]
max-image-pixels = 30000000

[tool.fastapi]
entrypoint = "invoice_assistant.api.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
